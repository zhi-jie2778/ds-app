  function importData() {
    const inp = h('input', { type: 'file', accept: '.json,application/json' });
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const j = JSON.parse(rd.result);
          let convs = j.convs || j;
          if (!Array.isArray(convs)) throw new Error('格式不对');
          const have = new Set(Store.data.convs.map(c => c.id));
          convs = convs.filter(c => c && !have.has(c.id)).map(c => {
            const nc = Object.assign({}, c);
            nc.id = uid();
            nc.messages = (c.messages || []).map(m => Object.assign({}, m, { id: uid() }));
            return nc;
          });
          Store.data.convs = convs.concat(Store.data.convs);
          if (j.settings && j.settings.apiKey) S().apiKey = j.settings.apiKey;
          saveNow(); closeAll(); Chat.renderAll(); toast('已导入 ' + convs.length + ' 个对话');
        } catch (e) { toast('导入失败：文件格式不正确'); }
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  function collectAllSources(m) {
    const all = [];
    (m.steps || []).forEach(st => (st.calls || []).forEach(c => {
      (c.sources || []).forEach(s => all.push({ url: s.url, title: s.title, icon: s.site_icon || '' }));
    }));
    const seen = new Set(); const out = [];
    all.forEach(s => { if (s.url && !seen.has(s.url)) { seen.add(s.url); out.push(s); } });
    return out;
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

  async function handlePick(f) {
    if (/^image\//.test(f.type)) {
      const url = await shrinkImage(f, 1400, 0.82);
      addImage(url, f.name);
      return;
    }
    if (f.size > 100 * 1024 * 1024) return toast('文件超过 100MB，无法上传');
    const att = { kind: 'file', name: f.name, uploading: true };
    Chat.draftAtts().push(att);
    Chat.renderAtts(); Chat.updateSendBtn();
    try {
      const r = await API.uploadFile(f);
      att.fileId = r.id; att.uploading = false; att.purpose = r.purpose;
      Chat.renderAtts(); Chat.updateSendBtn(); toast('文件已解析');
    } catch (e) {
      const i = Chat.draftAtts().indexOf(att);
      if (i > -1) Chat.draftAtts().splice(i, 1);
      Chat.renderAtts(); Chat.updateSendBtn();
      toast(e.message || '上传失败');
    }
  }

  function addImage(dataUrl, name) {
    Chat.draftAtts().push({ kind: 'image', name: name || '图片', dataUrl });
    U().recentImages = [dataUrl].concat(U().recentImages || []).slice(0, 12);
    Chat.renderAtts(); Chat.updateSendBtn(); saveNow();
  }

  /* ---------- share ---------- */
  function loadWhale() {
    return new Promise(res => {
      if (!window.__WHALE__) return res(null);
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = window.__WHALE__;
    });
  }

  async function share(msg) {
    const conv = curConv();
    const idx = conv.messages.findIndex(m => m.id === msg.id);
    let q = '';
    for (let i = idx - 1; i >= 0; i--) { if (conv.messages[i].role === 'user') { q = conv.messages[i].content; break; } }
    const whale = await loadWhale();
    const canvas = buildShareCanvas(q, MD.plain(msg.content), whale);
    const body = `<div class="share-preview"></div>
      <div class="share-bar">
        <button data-s="copy">复制文字</button>
        <button data-s="save">保存图片</button>
        <button class="primary" data-s="sys">分享</button>
      </div>`;
    open({ title: '分享', body, headClose: true, after: (b) => {
      $('.share-preview').appendChild(canvas);
      canvas.style.width = '100%';
      b.addEventListener('click', async e => {
        const btn = e.target.closest('[data-s]'); if (!btn) return;
        const k = btn.dataset.s;
        if (k === 'copy') copyText((q ? q + '\n\n' : '') + MD.plain(msg.content));
        if (k === 'save') canvas.toBlob(bl => downloadBlob(bl, 'deepseek-' + Date.now() + '.png'), 'image/png');
        if (k === 'sys') {
          canvas.toBlob(async bl => {
            const file = new File([bl], 'deepseek.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try { await navigator.share({ files: [file], title: 'DeepSeek' }); } catch (err) { }
            } else {
              downloadBlob(bl, 'deepseek.png');
            }
          }, 'image/png');
        }
      });
    } });
  }

  function buildShareCanvas(q, a, whale) {
    const W = 750, pad = 54;
    const c = document.createElement('canvas');
    const ratio = 2;
    c.width = W * ratio;
    const ctx = c.getContext('2d');
    ctx.scale(ratio, ratio);
    const font = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    const maxW = W - pad * 2;
    ctx.font = '34px ' + font;
    const qLines = q ? wrapText(ctx, q, maxW) : [];
    ctx.font = '32px ' + font;
    let aLines = wrapText(ctx, a, maxW);
    const lineH = 54;
    const MAX_H = 15000;
    const maxLines = Math.max(6, Math.floor((MAX_H - 400 - (q ? qLines.length * 46 : 0)) / lineH));
    if (aLines.length > maxLines) { aLines = aLines.slice(0, maxLines); aLines.push('\u2026\uff08\u5185\u5bb9\u8fc7\u957f\uff0c\u5df2\u622a\u65ad\uff09'); }
    const qH = q ? qLines.length * 46 + 40 : 0;
    const H = 190 + qH + aLines.length * lineH + 130;
    c.height = H * ratio;
    ctx.scale(1, 1);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    // bg
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    // header
    if (whale) {
      const wh = 34, ww = wh * (whale.width / whale.height);
      ctx.drawImage(whale, pad, 50, ww, wh);
    } else {
      ctx.fillStyle = '#597AEB';
      roundRect(ctx, pad, 52, 44, 34, 12); ctx.fill();
    }
    ctx.fillStyle = '#0F0F0F';
    ctx.font = '600 30px ' + font;
    ctx.fillText('DeepSeek', pad + 62, 78);
    ctx.fillStyle = '#9B9B9B';
    ctx.font = '24px ' + font;
    ctx.fillText(new Date().toLocaleDateString('zh-CN'), W - pad - 90, 78);

    let y = 140;
    if (q) {
      ctx.fillStyle = '#85868C'; ctx.font = '24px ' + font;
      ctx.fillText('提问', pad, y); y += 34;
      ctx.fillStyle = '#0F0F0F'; ctx.font = '34px ' + font;
      qLines.forEach(l => { ctx.fillText(l, pad, y + 34); y += 46; });
      y += 26;
    }
    ctx.fillStyle = '#85868C'; ctx.font = '24px ' + font;
    ctx.fillText('回答', pad, y); y += 34;
    ctx.fillStyle = '#1A1A1A'; ctx.font = '32px ' + font;
    aLines.forEach(l => { ctx.fillText(l, pad, y + 36); y += lineH; });

    ctx.strokeStyle = '#EDEDED'; ctx.beginPath(); ctx.moveTo(pad, H - 64); ctx.lineTo(W - pad, H - 64); ctx.stroke();
    ctx.fillStyle = '#B0B0B0'; ctx.font = '22px ' + font;
    ctx.fillText('由 DeepSeek 生成 · 仅供参考', pad, H - 28);
    ctx.fillStyle = '#597AEB';
    ctx.fillText('deepseek.com', W - pad - 150, H - 28);
    return c;
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function wrapText(ctx, text, maxW) {
    const out = [];
    String(text).split('\n').forEach(para => {
      if (!para.trim()) { out.push(''); return; }
      const NO_HEAD = '，。、；：？！）】》」』%';
      let line = '';
      for (const ch of para) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxW && line) {
          if (NO_HEAD.indexOf(ch) > -1) { line = test; continue; }
          out.push(line); line = ch;
        } else line = test;
      }
      if (line) out.push(line);
    });
    return out.length ? out : [''];
  }

      <p>4. 请遵守 DeepSeek 开放平台的服务条款与内容规范。</p></div>`
    });
  }
  function helpSheet() {

        <div class="row" data-act="maill"><span class="ri"><svg><use href="#i-doc"/></svg></span><span class="rl">API 文档</span><svg class="rc"><use href="#i-chev-r"/></svg></div>

/* ---------- image utils ---------- */
function shrinkImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const m = Math.max(w, h);
        if (m > maxSide) { const k = maxSide / m; w = Math.round(w * k); h = Math.round(h * k); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality || 0.82));
      };
      img.onerror = () => reject(new Error('图片读取失败'));
      img.src = fr.result;
    };
    fr.onerror = () => reject(new Error('图片读取失败'));
    fr.readAsDataURL(file);
  });
}


/* ==== js/50-boot.js ==== */
/* ================= boot & events ================= */
const GREETINGS = ['你好，我能帮什么忙吗？', '你好，让我们开始聊天吧', '今天想聊点什么？', '有什么我可以帮你的？'];
function pickGreeting() {
  const list = GREETINGS.filter(g => g !== U().greeting);
  return list[Math.floor(Math.random() * list.length)] || GREETINGS[0];
}

(function boot() {
  try {
  Store.load();
  applyTheme();
  applyFont();
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const fn = () => { if (S().theme === 'system') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', fn); else if (mq.addListener) mq.addListener(fn);
  }

  /* whale assets */
  const whale = document.body.dataset.whale || (window.__WHALE__ || '');
  if (whale) {
    $('#emptyWhale').src = whale;
    $('#setupWhale').src = whale;
  }

  const safe = (name, fn) => { try { fn(); } catch (e) { console.error('[init:' + name + ']', e); } };
  safe('profile', refreshProfile);
  safe('composer', bindComposer);
  safe('topbar', bindTopbar);
  safe('sidebar', bindSidebar);
  safe('messages', bindMessages);
  safe('voice', bindVoice);
  safe('misc', bindMisc);

  // restore last conversation or create one
  if (!curConv() && Store.data.convs.length) Store.data.curId = Store.data.convs[0].id;
  Chat.renderAll();
  if (window.__loadDraft) window.__loadDraft();
  Chat.renderAtts();
  Chat.updateSendBtn();

  if (!S().apiKey) openSetup();
  else $('#setup').hidden = true;

  if (location.hash === '#new') { /* reserved */ }
  } catch (err) {
    console.error('[boot]', err);
    try { toast('初始化异常：' + (err && err.message || err)); } catch (e) { }
  }
})();

/* ---------- profile ---------- */
function refreshProfile() {
  const p = S().profile;
  const av = p.avatar || avatarDataUri(p.name);
  $('#sbAvatar').src = av;
  $('#sbName').textContent = p.name || '本机用户';
  if (!U().greeting) U().greeting = GREETINGS[0];
  const t = document.querySelector('.empty-title');
  if (t) t.textContent = U().greeting;
}

/* ---------- setup ---------- */
function openSetup() {
  const el = $('#setup');
  el.hidden = false;
  const inp = $('#setupKey');
  inp.value = '';
  $('#setupGo').disabled = true;
  $('#setupErr').textContent = '';
  setTimeout(() => inp.focus(), 260);
}
(function () {
  const key = () => $('#setupKey');
  document.addEventListener('input', (e) => {
    if (e.target && e.target.id === 'setupKey') {
      $('#setupGo').disabled = e.target.value.trim().length < 10;
    }
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#setupEye')) {
      const i = key();
      i.type = i.type === 'password' ? 'text' : 'password';
      return;
    }
    if (e.target.closest('#setupGo')) {
      const v = key().value.trim();
      if (v.length < 10) return;
      S().apiKey = v; saveNow();
      $(`#setup`).hidden = true;
      refreshProfile();
      toast('已接入，开始对话吧');
      $('#input').focus();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'setupKey') {
      e.preventDefault();
      $('#setupGo').click();
    }
  });
})();

/* ---------- composer ---------- */
function bindComposer() {
  const input = $('#input');
  const box = $('#composer');

  const resize = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(150, Math.max(25, input.scrollHeight)) + 'px';
  };
  let draftTimer = 0;
  const draftKey = () => (Store.data.curId || '_new');
  const saveDraft = () => {
    U().drafts = U().drafts || {};
    const v = input.value;
    if (v) U().drafts[draftKey()] = v; else delete U().drafts[draftKey()];
    Store.save();
  };
  input.addEventListener('input', () => {
    resize(); Chat.updateSendBtn();
    clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 350);
  });
  input.addEventListener('blur', saveDraft);
  window.__loadDraft = () => {
    const v = (U().drafts || {})[draftKey()] || '';
    input.value = v;
    resize();
  };
  input.addEventListener('focus', () => box.classList.add('focus'));
  input.addEventListener('blur', () => box.classList.remove('focus'));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 640) {
      e.preventDefault();
      doSend();
    }
  });

  $('#btnSend').addEventListener('click', () => {
    if (Chat.isStreaming()) { Chat.stop(); return; }
    doSend();
  });

  $('#chipThink').addEventListener('click', () => {
    const d = S().draft = S().draft || { think: true, search: false };
    d.think = !d.think; Store.save(); Chat.updateSendBtn();
  });
  $('#chipSearch').addEventListener('click', () => {
    const d = S().draft = S().draft || { think: true, search: false };
    d.search = !d.search; Store.save(); Chat.updateSendBtn();
  });
  $('#btnPlus').addEventListener('click', () => Nav.plus());

  $('#attachPreview').addEventListener('click', (e) => {
    const rm = e.target.closest('.rm');
    if (!rm) return;
    const i = +rm.dataset.i;
    Chat.draftAtts().splice(i, 1);
    Chat.renderAtts(); Chat.updateSendBtn();
  });
}

function doSend() {
  const input = $('#input');
  const text = input.value;
  if (!text.trim() && !Chat.draftAtts().length) return;
  input.value = '';
  input.style.height = 'auto';
  U().drafts = U().drafts || {};
  delete U().drafts[Store.data.curId || '_new'];
  Store.save();
  Chat.updateSendBtn();
  Chat.send(text);
}

/* ---------- topbar ---------- */
function bindTopbar() {
  $('#btnSidebar').addEventListener('click', openSidebar);
  $('#btnNewChat').addEventListener('click', () => {
    if (Chat.isStreaming()) Chat.stop();
    if (!U().greetingCustom) { U().greeting = pickGreeting(); refreshProfile(); }
    const inp = $('#input');
    if (inp && inp.value) { U().drafts = U().drafts || {}; U().drafts[Store.data.curId || '_new'] = inp.value; }
    Store.data.curId = null;
    saveNow();
    renderSidebar();
    Chat.renderAll();
    if (window.__loadDraft) window.__loadDraft();
    Chat.updateSendBtn();
    $('#input').focus();
  });
  $('#btnAutoRead').addEventListener('click', () => {
    S().autoRead = !S().autoRead; Store.save(); Chat.updateSendBtn();
    toast(S().autoRead ? '已开启自动朗读' : '已关闭自动朗读');
    if (Nav && $('#sheetRoot') && !$('#sheetRoot').hidden) { }
  });
}

/* ---------- sidebar ---------- */
function openSidebar() {
  renderSidebar();
  $('#scrim').hidden = false;
  $('#sidebar').classList.add('open');
}
function closeSidebar() {
  $('#sidebar').classList.remove('open');
  setTimeout(() => { if (!$('#sidebar').classList.contains('open')) $('#scrim').hidden = true; }, 300);
}

function renderSidebar() {
  const q = ($('#convSearch').value || '').trim().toLowerCase();
  const list = $('#convList');
  list.innerHTML = '';
  let convs = Store.data.convs.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt);
  if (q) {
    convs = convs.filter(c => {
      if ((c.title || '').toLowerCase().indexOf(q) > -1) return true;
      return (c.messages || []).some(m => m.role === 'user' && (m.content || '').toLowerCase().indexOf(q) > -1);
    });
  }
  if (!convs.length) {
    list.innerHTML = `<div class="sb-empty">${q ? '没有找到相关对话' : '还没有对话，去问点什么吧'}</div>`;
    return;
  }
  let lastKey = '';
  if (!q) {
    const top = h('div', 'sb-sec');
    top.innerHTML = '<span>置顶</span><svg class="mg"><use href="#i-tune"/></svg>';
    list.appendChild(top);
    lastKey = '置顶';
  }
  convs.forEach(c => {
    const k = c.pinned ? '置顶' : dayKey(c.updatedAt);
    if (k !== lastKey) {
      lastKey = k;
      const sec = h('div', 'sb-sec', k);
      if (k === '置顶') sec.innerHTML = `<span>置顶</span>` + `<svg class="mg"><use href="#i-pin"/></svg>`;
      list.appendChild(sec);
    }
    const item = h('div', 'sb-item' + (c.id === Store.data.curId ? ' active' : ''));
    item.dataset.id = c.id;
    item.innerHTML = `<span class="t">${esc(c.title || '新对话')}</span><span class="dots"><svg width="18" height="18"><use href="#i-dots"/></svg></span>`;
    list.appendChild(item);
  });
}

function bindSidebar() {
  $('#scrim').addEventListener('click', closeSidebar);
  $('#convSearch').addEventListener('input', renderSidebar);
  $('#sbUser').addEventListener('click', () => { closeSidebar(); setTimeout(() => Nav.settings(), 200); });
  $('#convList').addEventListener('click', (e) => {
    if (Date.now() - lpSide < 600) { e.preventDefault(); e.stopPropagation(); return; }

/* ---------- messages ---------- */
function bindMessages() {

  box.addEventListener('click', async (e) => {
    if (Date.now() - lpMsg < 600) { e.preventDefault(); e.stopPropagation(); return; }
    const cite = e.target.closest('.cite');
    if (cite) {
      const msgEl = cite.closest('.msg');
      const m = findMsg(msgEl && msgEl.dataset.id);

        const a = m.annotations[+cite.dataset.i];

      m.thinkOpen = !m.thinkOpen;

      t.classList.toggle('open', m.thinkOpen);
      return;
    }
    if (act === 'copy') return copyText(m.content || '');

      sib.forEach(b => b.classList.remove('on'));
      if (!on) btn.classList.add('on');
      return;
    }
    if (act === 'read') return Chat.readAloud(m);
    if (act === 'share') return Nav.share(m);
    if (act === 'bill') return Nav.billing(m);
    if (act === 'regen' || act === 'retry') return Chat.regenerate(m.id);

      lpMsg = Date.now();

      const m = findMsg(msgEl.dataset.id);

  });
  ['pointerup', 'pointermove', 'pointercancel'].forEach(ev => box.addEventListener(ev, () => clearTimeout(lp)));

  const sc = $('#scroll');
  const toBottom = $('#toBottom');
  const syncBottomBtn = () => {
    const far = sc.scrollHeight - sc.scrollTop - sc.clientHeight > 260;
    toBottom.hidden = !far;
  };
  sc.addEventListener('scroll', () => {
    const t = $('#convTitle');
    const c = curConv();
    t.classList.toggle('show', !!(c && c.title) && (sc.scrollTop > 26 || c.messages.length > 0));
    syncBottomBtn();
  });
  toBottom.addEventListener('click', () => { sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }); });
  window.__syncBottomBtn = syncBottomBtn;
}

function findMsg(id) {
  const c = curConv();
  if (!c || !id) return null;
  return c.messages.find(m => m.id === id) || null;
}

function editUserMsg(m) {
  const c = curConv();
  const i = c.messages.indexOf(m);
  const text = m.content || '';
  c.messages.splice(i);
  saveNow(); Chat.renderAll();
  const inp = $('#input');
  inp.value = text; inp.focus();
  inp.style.height = 'auto';
  inp.style.height = Math.min(150, inp.scrollHeight) + 'px';
  Chat.updateSendBtn();
}

/* ---------- voice ---------- */
function bindVoice() {
  let media = null, ctx = null, proc = null, srcNode = null, chunks = [], t0 = 0, cancel = false, timer = 0, active = false;
  const wave = $('#wave');
  const overlay = $('#voiceOverlay');

  function paintWave() {
    if (!wave.children.length) {
      let html = '';
      for (let i = 0; i < 44; i++) html += '<i></i>';
      wave.innerHTML = html;
    }
    Array.from(wave.children).forEach(el => {
      const hgt = 6 + Math.random() * 38;
      el.style.height = hgt + 'px';
    });
  }

  async function start() {
    if (Chat.isStreaming()) return;
    if (active) return;
    active = true; cancel = false; chunks = []; t0 = Date.now();
    overlay.hidden = false;
    $('#voiceTip').textContent = '松手发送，上滑取消';
    $('#voiceTip').classList.remove('cancel');
    $('#voiceHold').classList.remove('cancel');
    paintWave();
    timer = setInterval(paintWave, 110);
    try {
      media = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      srcNode = ctx.createMediaStreamSource(media);
      proc = ctx.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = (ev) => {
        if (!active) return;
        chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
      };
      srcNode.connect(proc);
      proc.connect(ctx.destination);
    } catch (e) {
      cleanup();
      toast('无法使用麦克风：' + (e.message || '请检查权限'));
    }
  }

  async function stop(doCancel) {
    if (!active) return;
    active = false;
    overlay.hidden = true;
    clearInterval(timer);
    const dur = Date.now() - t0;
    const rate = ctx ? ctx.sampleRate : 48000;
    const list = chunks.slice();
    cleanup();
    if (doCancel || cancel || dur < 350 || !list.length) return;
    try {
      const wav = encodeWav(list, rate);
      toast('正在识别…');
      const text = await API.asr(wav);
      if (!text) return toast('没有听清，再说一次');
      const inp = $('#input');
      inp.value = (inp.value ? inp.value + ' ' : '') + text;
      inp.dispatchEvent(new Event('input'));
      inp.focus();
    } catch (e) { toast(e.message || '识别失败'); }
  }

  function cleanup() {
    try { if (proc) { proc.disconnect(); proc.onaudioprocess = null; } } catch (e) { }
    try { if (srcNode) srcNode.disconnect(); } catch (e) { }
    try { if (media) media.getTracks().forEach(t => t.stop()); } catch (e) { }
    try { if (ctx && ctx.state !== 'closed') ctx.close(); } catch (e) { }
    proc = null; srcNode = null; media = null; ctx = null; active = false;
  }

  function encodeWav(floatChunks, rate) {
    let total = 0;
    floatChunks.forEach(c => total += c.length);
    const buf = new ArrayBuffer(44 + total * 2);
    const v = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + total * 2, true); ws(8, 'WAVE');
    ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    ws(36, 'data'); v.setUint32(40, total * 2, true);
    let off = 44;
    for (let ci = 0; ci < floatChunks.length; ci++) {
      const c = floatChunks[ci];
      for (let i = 0; i < c.length; i++) {
        let s = Math.max(-1, Math.min(1, c[i]));
        v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  const over = overlay;
  function onDown(e) {
    e.preventDefault();
    start();
  }
  function onMove(e) {
    if (!active) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = y - t0Y;
    if (dy < -60 && !cancel) {
      cancel = true;
      $('#voiceTip').textContent = '松开取消';
      $('#voiceTip').classList.add('cancel');
      $('#voiceHold').classList.add('cancel');
    } else if (dy > -40 && cancel) {
      cancel = false;
      $('#voiceTip').textContent = '松手发送，上滑取消';
      $('#voiceTip').classList.remove('cancel');
      $('#voiceHold').classList.remove('cancel');
    }
  }
  let t0Y = 0;
  function onUp() { if (active) stop(cancel); }

  const mic = $('#btnMic');
  mic.addEventListener('pointerdown', (e) => { t0Y = e.clientY; onDown(e); mic.setPointerCapture && mic.setPointerCapture(e.pointerId); });
  mic.addEventListener('pointermove', onMove);
  mic.addEventListener('pointerup', onUp);
  mic.addEventListener('pointercancel', onUp);
  mic.addEventListener('contextmenu', e => e.preventDefault());

  const hold = $('#voiceHold');
  hold.addEventListener('pointerdown', (e) => { t0Y = e.clientY; e.preventDefault(); });
  hold.addEventListener('pointerup', onUp);
  over.addEventListener('pointermove', onMove);
  over.addEventListener('pointerup', onUp);
  over.addEventListener('pointercancel', onUp);
}

/* ---------- misc ---------- */
function bindMisc() {
  // keyboard height / visual viewport fix
  if (window.visualViewport) {
    const vv = window.visualViewport;
    let lastKb = 0;
    const syncKeyboard = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - (vv.offsetTop || 0));
      const keyboard = kb > 60 ? Math.round(kb) : 0;
      if (keyboard === lastKb) return;
      lastKb = keyboard;
      document.documentElement.style.setProperty('--kb', keyboard ? keyboard + 'px' : '0px');
      if (keyboard) {
        setTimeout(() => {
          const sc = document.querySelector('#scroll');
          if (sc) sc.scrollTop = sc.scrollHeight;
        }, 80);
      }
    };
    vv.addEventListener('resize', syncKeyboard);
    vv.addEventListener('scroll', syncKeyboard);
    window.addEventListener('orientationchange', () => setTimeout(syncKeyboard, 250));
  }

  // no system text selection / callout outside inputs
  const editable = (t) => !!(t && t.closest && t.closest('input,textarea,[contenteditable="true"]'));
  document.addEventListener('selectstart', (e) => { if (!editable(e.target)) e.preventDefault(); });
  document.addEventListener('contextmenu', (e) => {
    if (editable(e.target)) return;
    e.preventDefault();
  });
  document.addEventListener('dragstart', (e) => {
    if (!editable(e.target)) e.preventDefault();
  });

  // prevent double tap zoom
  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  // paste image
  document.addEventListener('paste', (e) => {
    const dt = e.clipboardData; if (!dt || !dt.items) return;
    for (const it of dt.items) {
      if (it.type && it.type.indexOf('image/') === 0) {
        const f = it.getAsFile();
        if (f) { e.preventDefault(); Nav.handlePick(f); return; }
      }
    }
  });

  // drag & drop
  const app = $('#app');
  ['dragenter', 'dragover'].forEach(ev => app.addEventListener(ev, (e) => {
    if (!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf('Files') < 0) return;
    e.preventDefault(); app.classList.add('dragging');
  }));
  ['dragleave', 'drop'].forEach(ev => app.addEventListener(ev, (e) => {
    if (ev === 'dragleave' && e.relatedTarget && app.contains(e.relatedTarget)) return;
    e.preventDefault(); app.classList.remove('dragging');
  }));
  app.addEventListener('drop', (e) => {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) Nav.handlePick(files[0]);
  });

  // edge swipe (touch gestures, preventDefault to stop browser back-swipe)
  let edge = null;
  const SW_START = 32, SW_FIRE = 58, SW_ABORT = 48;

  document.addEventListener('touchstart', (e) => {
    edge = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (e.target.closest && e.target.closest('input,textarea,.sheet-root,#sidebar,.composer,.voice-overlay')) return;
    if (t.clientX <= SW_START) edge = { x: t.clientX, y: t.clientY, fired: false };
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!edge || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - edge.x;
    const dy = Math.abs(t.clientY - edge.y);
    if (dy > SW_ABORT && dy > Math.abs(dx)) { edge = null; return; }
    if (dx <= 0) { if (Math.abs(dx) > 24) edge = null; return; }
    // horizontal rightward drag from the left edge: keep it in the app
    if (e.cancelable) e.preventDefault();
    if (!edge.fired && dx > SW_FIRE) { edge.fired = true; openSidebar(); }
  }, { passive: false });

  document.addEventListener('touchend', () => { edge = null; }, { passive: true });
  document.addEventListener('touchcancel', () => { edge = null; }, { passive: true });

  // swipe left inside the sidebar to close it (and swallow the gesture)
  let edgeSb = null;
  $('#sidebar').addEventListener('touchstart', (e) => {
    edgeSb = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, fired: false } : null;
  }, { passive: true });
  $('#sidebar').addEventListener('touchmove', (e) => {
    if (!edgeSb || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - edgeSb.x;
    const dy = Math.abs(t.clientY - edgeSb.y);
    if (dy > SW_ABORT && dy > Math.abs(dx)) { edgeSb = null; return; }
    if (dx >= 0) { if (dx > 24) edgeSb = null; return; }
    if (e.cancelable) e.preventDefault();
    if (!edgeSb.fired && dx < -SW_FIRE) { edgeSb.fired = true; closeSidebar(); }
  }, { passive: false });
  $('#sidebar').addEventListener('touchend', () => { edgeSb = null; }, { passive: true });

  // network status
  window.addEventListener('offline', () => toast('网络已断开，恢复后会自动重试'));
  window.addEventListener('online', () => toast('网络已恢复'));

  // esc closes overlays
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    Nav.closeAll();
    closeSidebar();
  });

  // KaTeX progressive enhancement (optional, network)
  if (window.renderMathInElement) {
    const obs = new MutationObserver(() => {
      if (!window.renderMathInElement) return;
      const ans = document.querySelectorAll('.answer:not(.mathdone)');
      ans.forEach(a => {
        try { window.renderMathInElement(a, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) { }
        a.classList.add('mathdone');
      });
    });
    obs.observe(document.querySelector('#messages'), { childList: true, subtree: true });
  }
}
</script>
