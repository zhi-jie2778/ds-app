*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input,textarea,select,[contenteditable="true"]{
  -webkit-user-select:text !important;-moz-user-select:text !important;
  -ms-user-select:text !important;user-select:text !important;
  -webkit-touch-callout:default !important;
}
img,a{-webkit-user-drag:none}
html,body{overscroll-behavior:none;overscroll-behavior-x:none}
/* keep horizontal gestures inside the app (browser back-swipe / pull-to-refresh) */
#app,.chat-scroll,.sidebar,.sheet-body,.sb-list,.topbar{touch-action:pan-y}
/* areas that must still pan horizontally */
.answer pre,.recent-strip,.share-preview{touch-action:auto}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  overscroll-behavior:none;
  font-size:var(--fs);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer}
input,textarea{font-family:inherit}
img{display:block}
[hidden]{display:none !important}

/* ============ shell ============ */
#app{
  position:relative;width:100%;max-width:480px;height:100%;
  margin:0 auto;background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;
  height:calc(100% - var(--kb, 0px));
  transition:background .25s ease, height .18s ease;
}
@media (min-width:520px){
  body{background:#E9E9EC}
  #app{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 20px 60px rgba(0,0,0,.12)}
}

/* ============ topbar ============ */
.topbar{
  position:absolute;left:0;right:0;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px;
  pointer-events:none;
}
.topbar::before{
  content:"";position:absolute;left:0;right:0;top:0;height:150%;
  background:linear-gradient(to bottom,var(--bg) 42%,color-mix(in srgb,var(--bg) 70%,transparent) 74%,transparent);
  pointer-events:none;z-index:-1;
}
.topbar > *{pointer-events:auto}
.topbar-title{
  flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(2px);transition:opacity .2s ease,transform .2s ease;
}
.topbar-title.show{opacity:1;transform:none}
.topbar-right{
  display:flex;align-items:center;gap:2px;
  height:44px;padding:0 4px;border-radius:22px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  border:.5px solid var(--glass-line);
  box-shadow:0 2px 10px rgba(17,17,26,.06),inset 0 1px 0 rgba(255,255,255,.55);
}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);transition:background .15s,transform .15s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:24px;height:24px}
.icon-btn.glass{
  width:44px;height:44px;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  border:.5px solid var(--glass-line);
  box-shadow:0 2px 10px rgba(17,17,26,.06),inset 0 1px 0 rgba(255,255,255,.55);
}
.icon-btn.plain svg{width:27px;height:27px}
.icon-btn.ghost:hover{background:var(--surface-2)}

/* ============ scroll area ============ */
.chat-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 66px) 20px 210px;
  scrollbar-width:none;
}
.chat-scroll::-webkit-scrollbar{display:none}

/* ============ empty state ============ */
.empty{
  position:absolute;left:0;right:0;top:0;bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding-bottom:36px;pointer-events:none;
}
.empty .whale{width:45px;height:auto;opacity:.98}
[data-theme="dark"] .empty .whale{filter:brightness(1.12) saturate(1.05)}
.empty-title{font-size:20px;font-weight:600;letter-spacing:.2px;margin:0;color:var(--text)}

/* ============ messages ============ */
.messages{display:flex;flex-direction:column}
.msg{display:flex;flex-direction:column}
.msg.user{align-items:flex-end;margin:18px 0 12px}
.bubble{
  max-width:84%;background:var(--blue-soft);color:var(--text);
  padding:10px 14px;border-radius:18px;font-size:17px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}
.bubble:active{opacity:.9}
.bubble-body{display:flex;flex-direction:column;gap:8px}
.bubble-attach{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.attach-thumb{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
.attach-file{
  display:flex;align-items:center;gap:8px;max-width:230px;
  background:rgba(255,255,255,.7);border-radius:10px;padding:8px 10px;font-size:13px;
}
[data-theme="dark"] .attach-file{background:rgba(255,255,255,.08)}
.attach-file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.msg.ai{margin:2px 0 28px;font-size:17px;line-height:1.75;color:var(--text)}
.msg.ai .answer{word-break:break-word}

/* thinking */
.think{margin:2px 0 4px}
.think-head{
  display:inline-flex;align-items:center;gap:5px;
  color:var(--text-3);font-size:15px;line-height:1.4;padding:5px 0;
  transition:color .15s;
}
.think-head:active{color:var(--text-2)}
.think-head .chev{width:16px;height:16px;transition:transform .22s ease}
.think.open .think-head .chev{transform:rotate(90deg)}
.think-body{
  display:none;margin:6px 0 14px;padding-left:13px;
  border-left:2px solid var(--line);color:var(--text-2);
  font-size:15px;line-height:1.78;
}
.think.open .think-body{display:block;animation:fadeIn .18s ease}
.think-p{display:flex;gap:8px;margin:0 0 10px}
.think-p:last-child{margin-bottom:2px}
.think-p .dot{flex:0 0 auto;color:var(--text-3);font-size:15px;line-height:1.78}
.think-p .tx{white-space:pre-wrap;word-break:break-word}
.thinking-live .think-head{color:var(--blue)}
.think-dots i{display:inline-block;width:3px;height:3px;border-radius:50%;background:currentColor;margin:0 1.5px;animation:blink 1.1s infinite}
.think-dots i:nth-child(2){animation-delay:.18s}
.think-dots i:nth-child(3){animation-delay:.36s}

/* tool rows inside thinking */
.tool-row{display:flex;align-items:center;gap:7px;margin:9px 0;color:var(--text-2);font-size:14.5px}
.tool-row .ti{width:17px;height:17px;flex:0 0 auto;color:var(--text-2)}
.tool-row .favs{display:flex;align-items:center;gap:-4px}
.tool-row .fav{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bg);object-fit:cover;margin-left:-5px;background:#fff}
.tool-row .fav:first-child{margin-left:0}

/* answer markdown */
.answer p{margin:0 0 12px}
.answer p:last-child{margin-bottom:0}
.answer h1,.answer h2,.answer h3,.answer h4{margin:20px 0 10px;font-weight:600;line-height:1.4}
.answer h1{font-size:21px}
.answer h2{font-size:19.5px}
.answer h3{font-size:18px}
.answer h4{font-size:17px}
.answer ul,.answer ol{margin:0 0 12px;padding-left:22px}
.answer li{margin:5px 0}
.answer strong{font-weight:600}
.answer em{font-style:italic}
.answer a{color:var(--blue);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--blue) 35%,transparent)}
.answer blockquote{
  margin:12px 0;padding:2px 0 2px 12px;border-left:3px solid var(--line-strong);color:var(--text-2);
}
.answer hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.answer code{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.9em;
  background:var(--surface-2);padding:2px 5px;border-radius:5px;
}
.answer pre{
  position:relative;margin:12px 0;background:var(--surface-2);
  border-radius:12px;padding:14px 14px 12px;overflow:auto;
}
.answer pre code{background:none;padding:0;font-size:13.5px;line-height:1.6;white-space:pre}
.code-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--text-3);margin:14px 0 -6px;
}
.copy-code{font-size:12px;color:var(--text-2);padding:2px 6px;border-radius:6px}
.copy-code:active{background:var(--surface-2)}
.answer table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px;display:block;overflow-x:auto}
.answer th,.answer td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.answer th{background:var(--surface-2);font-weight:600}
.answer .katex{font-size:1.02em}

/* citations */
.cite{
  display:inline-block;font-size:9.5px;line-height:1.6;color:#8D93A8;
  background:#F0F2F8;border-radius:4px;padding:0 3px;margin:0 1px;
  vertical-align:super;cursor:pointer;
}
[data-theme="dark"] .cite{background:rgba(255,255,255,.09);color:#9AA1B8}
.cite:active{filter:brightness(.95)}

/* sources pill */
.sources{
  display:inline-flex;align-items:center;gap:9px;margin:14px 0 4px;
  border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;
  font-size:13.5px;color:var(--text-3);background:var(--surface);
}
.sources .favs{display:flex}
.sources .fav{width:18px;height:18px;border-radius:50%;object-fit:cover;margin-left:-5px;border:1.5px solid var(--surface);background:#fff}
.sources .fav:first-child{margin-left:0}
.sources .more{font-size:12px;background:var(--surface-2);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin-left:-5px}

/* actions */
.actions{display:flex;align-items:center;gap:22px;margin-top:16px;color:var(--text-3)}
.actions button{color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:color .15s,transform .12s}
.actions button:active{transform:scale(.9)}
.actions svg{width:21px;height:21px}
.actions .spacer{flex:1}
.actions .on{color:var(--blue)}
.actions .bill{
  font-size:12px;height:22px;padding:0 8px;border-radius:11px;
  border:1px solid var(--line);color:var(--text-3);gap:3px;
}
.answer-note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.5}

/* streaming caret */
.caret{display:inline-block;width:7px;height:16px;background:var(--blue);border-radius:2px;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}

/* error */
.err-box{
  margin-top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  background:color-mix(in srgb,var(--danger) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--danger) 22%,transparent);
  border-radius:12px;padding:10px 12px;font-size:14px;color:var(--danger);line-height:1.5;
}
.err-box button{font-size:13px;color:var(--danger);text-decoration:underline}
.err-acts{display:flex;gap:14px;align-items:center}

/* ============ composer ============ */
.composer-wrap{
  position:absolute;left:0;right:0;bottom:0;z-index:40;
  padding:0 6px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(to top,var(--bg) 58%,color-mix(in srgb,var(--bg) 88%,transparent) 82%,transparent);
}
.composer{
  background:var(--surface);border:1px solid var(--line);
  border-radius:26px;padding:13px 16px 10px;
  box-shadow:var(--shadow-card);
  transition:border-color .2s,box-shadow .2s;
}
.composer.focus{border-color:var(--line-strong)}
.composer-row{display:flex;align-items:center;gap:8px;margin-top:2px}
#input{
  display:block;width:100%;border:none;outline:none;background:transparent;resize:none;
  font-size:17px;line-height:1.45;color:var(--text);
  padding:1px 2px 6px;max-height:150px;min-height:50px;overflow-y:auto;
}
#input::placeholder{color:var(--text-3)}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
  border-radius:17px;background:var(--chip);color:var(--text);
  font-size:14.5px;font-weight:400;white-space:nowrap;
  transition:background .18s,color .18s,transform .12s;
}
.chip svg{width:22px;height:22px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--blue-soft);color:var(--blue)}
.composer-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.composer-actions .icon-btn{width:34px;height:34px}
.composer-actions svg{width:26px;height:26px}
.send-btn{
  width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,opacity .15s;
}
.send-btn:active{transform:scale(.92)}
.send-btn svg{width:19px;height:19px}
.send-btn.stop{background:var(--text)}
.send-btn.stop svg{width:12px;height:12px}
.send-btn[disabled]{opacity:.35}
.disclaimer{
  text-align:center;font-size:11px;color:var(--text-3);padding:6px 0 2px;
  letter-spacing:.2px;
}
.disclaimer.hide{visibility:hidden}

/* attachments in composer */
.attach-preview{display:flex;gap:8px;flex-wrap:wrap;padding:2px 2px 8px}
.attach-chip{
  position:relative;display:flex;align-items:center;gap:7px;height:32px;
  padding:0 10px;border-radius:9px;background:var(--surface-2);font-size:13px;color:var(--text-2);
  max-width:210px;
}
.attach-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip .rm{
  width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;flex:0 0 auto;
}
.attach-chip.img{padding:0;background:none;height:56px;width:56px}
.attach-chip.img img{width:56px;height:56px;border-radius:9px;object-fit:cover}
.attach-chip.img .rm{position:absolute;top:-5px;right:-5px}

/* ============ animations ============ */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

/* back to bottom */
.to-bottom{
  position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 154px);z-index:38;
  width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(17,17,26,.10);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:opacity .18s,transform .18s;
}
.to-bottom svg{width:20px;height:20px}
.to-bottom:active{transform:scale(.92)}
.answer-note.stopped{color:var(--text-3);font-style:normal}
.answer-note.stopped::before{content:"·";margin-right:6px;opacity:.6}
#app.dragging::after{
  content:"";position:absolute;inset:8px;border:2px dashed var(--blue);border-radius:20px;
  background:color-mix(in srgb,var(--blue) 6%,transparent);z-index:150;pointer-events:none;
}

/* favicon fallback */
.fav-ph{display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-3)}
.fav-ph svg{width:70%;height:70%}
/* focus ring (keyboard only) */
button:focus-visible,.row:focus-visible,.sb-item:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
/* user message entrance */
.msg.user{animation:popIn .2s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ============ scrim & sidebar ============ */
.scrim{
  position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.16);
  -webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);
  animation:fadeIn .2s ease;
}
.sidebar{
  position:absolute;left:0;top:0;bottom:0;z-index:60;
  width:62%;max-width:300px;
  background:var(--surface);
  border-radius:0 26px 26px 0;
  box-shadow:8px 0 40px rgba(0,0,0,.1);
  display:flex;flex-direction:column;
  transform:translateX(-102%);
  transition:transform .3s cubic-bezier(.22,1,.36,1);
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
}
.sidebar.open{transform:none}
.sb-search{
  margin:0 14px 6px;height:38px;border-radius:19px;background:var(--surface-2);
  display:flex;align-items:center;gap:8px;padding:0 13px;color:var(--text-3);
}
.sb-search svg{width:17px;height:17px;flex:0 0 auto}
.sb-search input{
  flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--text);
}
.sb-search input::placeholder{color:var(--text-3)}
.sb-list{flex:1;overflow-y:auto;padding:2px 0 10px;scrollbar-width:none}
.sb-list::-webkit-scrollbar{display:none}
.sb-sec{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--text-3);padding:14px 24px 6px;letter-spacing:.2px;
}
.sb-sec .mg{width:18px;height:18px;color:var(--text-3)}
.sb-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:1px 10px;padding:0 12px;height:46px;border-radius:12px;
  font-size:15.5px;color:var(--text);cursor:pointer;
  transition:background .15s;
}
.sb-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .dots{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text-3);opacity:0}
.sb-item.active{background:var(--blue-soft);color:var(--blue)}
.sb-item.active .dots{opacity:1;color:var(--blue)}
.sb-item:active{background:var(--surface-2)}
.sb-item.active:active{background:var(--blue-soft)}
.sb-empty{font-size:13.5px;color:var(--text-3);padding:26px 24px;text-align:center}
.sb-user{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  border-top:1px solid var(--line);
}
.sb-user .av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex:0 0 auto}
.sb-user .nm{font-size:15.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .dots{color:var(--text-3);width:26px;height:26px;display:flex;align-items:center;justify-content:center}

/* ============ generic sheet ============ */
.sheet-root{position:absolute;inset:0;z-index:80;opacity:0;pointer-events:none;transition:opacity .22s ease}
.sheet-root.visible{opacity:1;pointer-events:auto}
.sheet-backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  animation:fadeIn .22s ease;
}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:94%;
  background:var(--sheet-bg);
  border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.12);
}
.sheet.in{transform:none}
.sheet.full{top:calc(env(safe-area-inset-top,0px) + 12px);max-height:none}
.sheet.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.sheet-head{
  position:relative;display:flex;align-items:center;justify-content:center;
  height:56px;flex:0 0 auto;padding:0 14px;
}
.sheet-head .ttl{font-size:17px;font-weight:600}
.sheet-head .close{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.07);border:.5px solid var(--line);
}
.sheet-head .back{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.07);border:.5px solid var(--line);
}
.sheet-head svg{width:17px;height:17px}
.sheet-body{flex:1;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:8px auto 0}

/* settings */
.group-label{font-size:13px;color:var(--text-3);padding:18px 24px 8px;letter-spacing:.2px}
.card{background:var(--surface);margin:0 14px;border-radius:16px;overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;
  font-size:16.5px;color:var(--text);cursor:pointer;position:relative;
}
.row + .row::before{
  content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line);
}
.row .ri{width:22px;height:22px;color:var(--text);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.row .ri svg{width:21px;height:21px}
.row .rl{flex:1;min-width:0}
.row .rv{color:var(--text-3);font-size:15.5px;display:flex;align-items:center;gap:3px}
.row .rc{width:18px;height:18px;color:#C4C4C8;flex:0 0 auto}
.row:active{background:var(--surface-2)}
.row.danger{color:var(--danger)}
.row.danger .ri{color:var(--danger)}
.row.center{justify-content:center;color:var(--danger)}
.row.about-min{min-height:44px;font-size:13px;color:var(--text-3);justify-content:center}
.switch{
  width:44px;height:26px;border-radius:13px;background:var(--line-strong);
  position:relative;transition:background .2s;flex:0 0 auto;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;
}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(18px)}

/* plus sheet */
.plus-sheet{background:transparent;box-shadow:none}
.plus-wrap{padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.recent-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:none}
.recent-strip::-webkit-scrollbar{display:none}
.recent-thumb{
  width:74px;height:126px;border-radius:12px;object-fit:cover;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(0,0,0,.14);background:#fff;
}
.plus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plus-card{
  background:var(--surface);border-radius:16px;height:104px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  font-size:16px;color:var(--text);
  box-shadow:var(--shadow-card);
  transition:transform .12s;
}
.plus-card:active{transform:scale(.97)}
.plus-card svg{width:27px;height:27px}
.plus-cancel{
  margin-top:8px;height:52px;border-radius:16px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:16.5px;color:var(--text);
  box-shadow:var(--shadow-card);
}

/* voice overlay */
.voice-overlay{
  position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(0,0,0,.04);
}
.voice-panel{
  padding:0 26px calc(env(safe-area-inset-bottom,0px) + 26px);
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.voice-tip{font-size:15px;color:var(--text-2);letter-spacing:.3px}
.voice-tip.cancel{color:var(--danger)}
.wave{
  display:flex;align-items:center;justify-content:center;gap:3px;height:46px;width:100%;
}
.wave i{
  width:3px;border-radius:2px;background:var(--blue);height:6px;
  transition:height .08s linear;opacity:.95;
}
.voice-btn-row{display:flex;align-items:center;gap:16px;margin-top:4px}
.voice-hold{
  width:74px;height:74px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px color-mix(in srgb,var(--blue) 40%,transparent);
  transition:transform .15s,background .15s;
}
.voice-hold svg{width:30px;height:30px}
.voice-hold.cancel{background:var(--danger);transform:scale(.92)}

/* sources sheet */
.src-item{display:flex;gap:11px;padding:12px 18px;align-items:flex-start;cursor:pointer}
.src-item + .src-item{border-top:1px solid var(--line)}
.src-item .fav{width:20px;height:20px;border-radius:50%;flex:0 0 auto;margin-top:2px;background:var(--surface-2);object-fit:cover}
.src-item .st{font-size:15px;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src-item .su{font-size:12.5px;color:var(--text-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* billing sheet */
.bill-card{background:var(--surface);margin:8px 14px;border-radius:16px;padding:18px 16px 8px}
.bill-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.bill-top .l{font-size:14px;color:var(--text-3)}
.bill-top .r{font-size:26px;font-weight:600;letter-spacing:-.3px}
.bill-sub{font-size:12px;color:var(--text-3);margin-bottom:14px}
.bill-sec{font-size:13px;color:var(--text-2);font-weight:600;margin:16px 0 8px}
.bill-grid{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:13.5px;color:var(--text-2)}
.bill-grid .h{color:var(--text-3);font-size:12.5px}
.bill-grid .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.bill-bar{height:6px;border-radius:3px;background:var(--surface-2);margin:8px 0 6px;overflow:hidden}
.bill-bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bill-foot{font-size:12px;color:var(--text-3);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 6px);line-height:1.6}

/* action sheet */
.act-sheet{background:transparent;box-shadow:none;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.act-group{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card)}
.act-item{
  height:54px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16.5px;color:var(--text);
}
.act-item + .act-item{border-top:1px solid var(--line)}
.act-item.danger{color:var(--danger)}
.act-item:active{background:var(--surface-2)}
.act-cancel{margin-top:8px;background:var(--surface);border-radius:16px;height:54px;display:flex;align-items:center;justify-content:center;font-size:16.5px;box-shadow:var(--shadow-card)}

/* ============ setup / onboarding ============ */
.setup{
  position:absolute;inset:0;z-index:120;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 30px calc(env(safe-area-inset-bottom,0px) + 20px);
  text-align:center;
}
.setup .whale{width:58px;margin-bottom:22px}
.setup h1{font-size:23px;font-weight:600;margin:0 0 10px;letter-spacing:.2px}
.setup p{font-size:14.5px;color:var(--text-2);line-height:1.65;margin:0 0 26px;max-width:320px}
.setup .field{
  width:100%;max-width:330px;height:50px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;padding:0 14px;gap:8px;margin-bottom:12px;
}
.setup .field input{
  flex:1;min-width:0;border:none;outline:none;background:none;
  font-size:15.5px;color:var(--text);
}
.setup .field input::placeholder{color:var(--text-3)}
.setup .field .eye{color:var(--text-3);display:flex}
.setup .go{
  width:100%;max-width:330px;height:50px;border-radius:25px;
  background:var(--text);color:var(--bg);font-size:16.5px;font-weight:500;
  display:flex;align-items:center;justify-content:center;margin-top:6px;
  transition:transform .12s,opacity .15s;
}
.setup .go:active{transform:scale(.98)}
.setup .go[disabled]{opacity:.4}
.setup .hint{font-size:12px;color:var(--text-3);margin-top:16px;line-height:1.6;max-width:320px}
.setup .hint a{color:var(--blue);text-decoration:none}
.setup .err{font-size:13px;color:var(--danger);margin-top:10px;min-height:18px}

/* ============ toast ============ */
.toast{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
  transform:translate(-50%,10px);z-index:200;
  background:rgba(20,20,22,.9);color:#fff;font-size:13.5px;
  padding:9px 16px;border-radius:18px;max-width:80%;text-align:center;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* share */
.share-preview{display:flex;justify-content:center;padding:10px 14px 4px}
.share-preview canvas{width:100%;max-width:330px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
.share-bar{display:flex;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.share-bar button{
  flex:1;height:46px;border-radius:14px;background:var(--surface);
  font-size:15.5px;color:var(--text);box-shadow:var(--shadow-card);
}
.share-bar button.primary{background:var(--blue);color:#fff}

/* font size */
[data-font="small"]{--fs:15.5px}
[data-font="large"]{--fs:18px}
[data-font="xlarge"]{--fs:19.5px}
[data-font="small"] .answer,[data-font="small"] .msg.ai{font-size:15.5px}
[data-font="large"] .answer,[data-font="large"] .msg.ai{font-size:18px}
[data-font="xlarge"] .answer,[data-font="xlarge"] .msg.ai{font-size:19.5px}

/* plus sheet backdrop: blur only */
#sheetRoot.blurred .sheet-backdrop{background:rgba(248,248,250,.18);-webkit-backdrop-filter:blur(11px) saturate(140%);backdrop-filter:blur(11px) saturate(140%)}
[data-theme="dark"] #sheetRoot.blurred .sheet-backdrop{background:rgba(0,0,0,.22)}

/* billing rows */
.bill-line{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:13.5px}
.bill-line .bl{color:var(--text-2);flex:1;min-width:0}
.bill-line .bn{color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.bill-line .bu{color:var(--text-3);font-size:12px;min-width:80px;text-align:right}
.bill-line .ba{color:var(--text);min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.bill-total{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px;font-size:14.5px}
.bill-total .bl{font-weight:600;color:var(--text);flex:1}
.bill-total .bn{color:var(--text-3);font-size:12.5px}
.bill-total .ba{font-weight:600;min-width:76px;text-align:right;font-variant-numeric:tabular-nums}</style>

/* ==== js/00-state.js ==== */
/* ================= state & utils ================= */
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const DEFAULT_SETTINGS = {
  apiKey: '',
  baseUrl: 'https://api.deepseek.com',
  model: 'deepseek-flash',
  theme: 'system',
  font: 'normal',
  autoRead: false,
  voice: 'stella',
  billing: true,
  minor: false,
  profile: { name: '', avatar: '' },
  draft: { think: true, search: true }
};

function genNickname() {
  return '用户' + String(Math.floor(100000 + Math.random() * 900000));
}

const Store = {
  KEY: 'dsx.v1',
  data: null,
  timer: 0,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (e) { }
    let d = null;
    if (raw) { try { d = JSON.parse(raw); } catch (e) { d = null; } }
    if (!d || typeof d !== 'object') d = {};
    this.data = {
      convs: Array.isArray(d.convs) ? d.convs : [],
      curId: d.curId || null,
      settings: Object.assign({}, DEFAULT_SETTINGS, d.settings || {}),
      ui: d.ui || {}
    };
    if (d.settings && d.settings.draft === undefined) this.data.settings.draft = { ...DEFAULT_SETTINGS.draft };
    const prof = this.data.settings.profile = Object.assign({ name: '', avatar: '' }, this.data.settings.profile || {});
    // 旧版本把作者网名当默认值，这里迁移掉，不覆盖用户自己改过的
    if (!prof.name || prof.name === '砚辞') prof.name = genNickname();
    return this.data;
  },
  save(now) {
    clearTimeout(this.timer);
    const run = () => {
      try {
        localStorage.setItem(this.KEY, JSON.stringify(this.data));
      } catch (e) {
        console.warn('save failed', e);
        if (String(e).indexOf('quota') > -1) toast('本地存储已满，建议删除部分含图片的对话');
      }
    };
    if (now) run(); else this.timer = setTimeout(run, 260);
  }
};

const S = () => Store.data.settings;
const U = () => Store.data.ui;

function saveNow() { Store.save(true); }

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg, ms) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 1900);
}

/* ---------- theme / font ---------- */
function resolveTheme() {
  const t = S().theme;
  if (t === 'dark') return 'dark';
  if (t === 'light') return 'light';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
  const th = resolveTheme();
  document.documentElement.dataset.theme = th;
  document.documentElement.style.colorScheme = th === 'dark' ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', th === 'dark' ? '#0C0C0E' : '#FFFFFF');
}
function applyFont() {
  document.documentElement.dataset.font = S().font || 'normal';
}

/* ---------- conversation model ---------- */
function newConv() {
  const c = {
    id: uid(), title: '', createdAt: Date.now(), updatedAt: Date.now(),
    pinned: false, messages: []
  };
  Store.data.convs.unshift(c);
  Store.data.curId = c.id;
  return c;
}
function curConv() {
  const id = Store.data.curId;
  return Store.data.convs.find(c => c.id === id) || null;
}
function convById(id) { return Store.data.convs.find(c => c.id === id) || null; }
function ensureConv() {
  let c = curConv();
  if (!c) c = newConv();
  return c;
}
function deleteConv(id) {
  const i = Store.data.convs.findIndex(c => c.id === id);
  if (i > -1) Store.data.convs.splice(i, 1);
  if (Store.data.curId === id) Store.data.curId = (Store.data.convs[0] || {}).id || null;
  Store.save();
}
function touched(c) {
  c.updatedAt = Date.now();
  const i = Store.data.convs.indexOf(c);
  if (i > 0) { Store.data.convs.splice(i, 1); Store.data.convs.unshift(c); }
}

/* ---------- time helpers ---------- */
function dayKey(ts) {
  const d = new Date(ts); const n = new Date();
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const t = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  const diff = Math.round((t - s) / 86400000);
  if (diff <= 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff <= 7) return '7 天内';
  if (diff <= 30) return '30 天内';
  return '更早';
}
function fmtCost(n) {
  if (!isFinite(n)) return '—';
  if (n === 0) return '0';
  if (n < 0.0001) return '<0.0001';
  return n.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
}

/* ---------- avatar ---------- */
function avatarDataUri(name, size) {
  const ch = (name || 'D').trim().slice(0, 1) || 'D';
  const s = size || 64;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FA6F7"/><stop offset="1" stop-color="#597AEB"/></linearGradient></defs><rect width="64" height="64" rx="32" fill="url(#g)"/><text x="32" y="42" font-size="30" font-family="-apple-system,PingFang SC,sans-serif" fill="#fff" text-anchor="middle" font-weight="600">${esc(ch)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- DOM helpers ---------- */
function h(tag, attrs, children) {
  const e = document.createElement(tag);
  if (typeof attrs === 'string') attrs = { class: attrs };
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if (children) (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function icon(id, cls) {
  return `<svg class="${cls || ''}" aria-hidden="true"><use href="#${id}"/></svg>`;
}

/* ---------- clipboard ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    toast('已复制');
    return true;
  } catch (e) { toast('复制失败'); return false; }
}

/* ---------- download ---------- */
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ================= markdown ================= */
const MD = (() => {
  const CITE_OPEN = '\u0001C', CITE_CLOSE = '\u0001';

  function inline(s, cites) {
    let t = esc(s);
    // inline code first (protect)
    const codes = [];
    t = t.replace(/`([^`\n]+)`/g, (m, c) => {
      codes.push(c); return '\u0002C' + (codes.length - 1) + '\u0002';
    });
    // images ![alt](url)
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => `<img src="${u}" alt="${a}" loading="lazy">`);
    // links
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
    // bold / italic / strike
    t = t.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[\s(（])\*([^*\n]+)\*(?=[\s)）.,，。!?！？]|$)/g, '$1<em>$2</em>');
    t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // restore code
    t = t.replace(/\u0002C(\d+)\u0002/g, (m, i) => '<code>' + codes[+i] + '</code>');
    // citations
    t = t.replace(/\u0001C(\d+)\u0001/g, (m, i) => {
      const c = cites && cites[+i];
      if (!c) return '';
      return `<sup class="cite" data-i="${i}">${i + 1}</sup>`;
    });
    return t;
  }

  function render(src, cites) {
    if (!src) return '';
    const text = String(src).replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    const out = [];
    let i = 0;

    while (i < lines.length) {
      let line = lines[i];

      // fenced code
      const fence = line.match(/^\s*```([\w+#-]*)\s*$/);
      if (fence) {
        const lang = fence[1] || '';
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push(`<div class="code-wrap"><div class="code-head"><span>${esc(lang || 'text')}</span><button class="copy-code" type="button">复制</button></div><pre><code>${esc(buf.join('\n'))}</code></pre></div>`);
        continue;
      }

      // table
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') > -1) {
        const head = splitRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        let html = '<table><thead><tr>' + head.map(c => `<th>${inline(c, cites)}</th>`).join('') + '</tr></thead><tbody>';
        rows.forEach(r => {
          html += '<tr>' + head.map((_, k) => `<td>${inline(r[k] || '', cites)}</td>`).join('') + '</tr>';
        });
        out.push(html + '</tbody></table>');
        continue;
      }

      // heading
      const hd = line.match(/^(#{1,6})\s+(.*)$/);
      if (hd) {
        const lv = Math.min(hd[1].length, 4);
        out.push(`<h${lv}>${inline(hd[2], cites)}</h${lv}>`);
        i++; continue;
      }

      // hr
      if (/^\s*([-*_])\s*(\1\s*){2,}$/.test(line)) { out.push('<hr>'); i++; continue; }

      // blockquote
      if (/^\s*>\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + buf.map(b => inline(b, cites)).join('<br>') + '</blockquote>');
        continue;
      }

      // lists
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d+[.)]\s+/.test(line);
        const items = [];
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
          let it = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
          i++;
          // lazy continuation lines
          while (i < lines.length && lines[i].trim() && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && !/^\s*(```|#{1,6}\s|>)/.test(lines[i])) {
            it += '\n' + lines[i].trim(); i++;
          }
          items.push(it);
        }
        const tag = ordered ? 'ol' : 'ul';
        out.push(`<${tag}>` + items.map(it => `<li>${inline(it, cites)}</li>`).join('') + `</${tag}>`);
        continue;
      }

      // blank
      if (!line.trim()) { i++; continue; }

      // paragraph
      const buf = [];
      while (i < lines.length && lines[i].trim() &&
        !/^\s*(```|#{1,6}\s|>\s?|([-*+]|\d+[.)])\s+)/.test(lines[i]) &&
        !/^\s*\|/.test(lines[i])) {
        buf.push(lines[i]); i++;
      }
      if (buf.length) out.push('<p>' + inline(buf.join('\n'), cites).replace(/\n/g, '<br>') + '</p>');
      else { out.push('<p>' + inline(line, cites) + '</p>'); i++; }
    }
    return out.join('');
  }

  function splitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
  }

  /* insert citation markers into plain text at code-point offsets */
  function withCitations(text, annotations) {
    if (!annotations || !annotations.length) return { text: text || '', cites: [] };
    const cps = Array.from(text || '');
    const cites = annotations.map(a => ({ url: a.url || (a.url_citation && a.url_citation.url) || '', title: a.title || (a.url_citation && a.url_citation.title) || '' }));
    // process backwards so offsets stay valid
    const list = annotations.map((a, idx) => {
      const s = a.start_index != null ? a.start_index : (a.url_citation ? a.url_citation.start_index : 0);
      return { s: Math.max(0, Math.min(cps.length, s)), idx };
    }).sort((x, y) => y.s - x.s);
    list.forEach(o => cps.splice(o.s, 0, CITE_OPEN + o.idx + CITE_CLOSE));
    return { text: cps.join(''), cites };
  }

  function plain(src) {
    return String(src || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/[*_~>#|]/g, '')
      .replace(/\u0001C\d+\u0001/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  return { render, plain, withCitations };
})();

/* ================= api ================= */
class ApiError extends Error {
  constructor(status, message, body) {
    super(message); this.name = 'ApiError'; this.status = status; this.body = body || '';
  }
}

const API = (() => {
  const base = () => (S().baseUrl || 'https://api.deepseek.com').replace(/\/+$/, '');
  const auth = () => ({ 'Authorization': 'Bearer ' + (S().apiKey || '').trim(), 'Content-Type': 'application/json' });

  function friendly(status, bodyText) {
    let msg = '';
    try {
      const j = JSON.parse(bodyText);
      msg = (j.error && (j.error.message || j.error.type)) || j.message || '';
    } catch (e) { msg = String(bodyText || '').slice(0, 200); }
    const map = {
      400: '请求参数有误',
      401: 'API Key 无效或已过期',
      402: '账户余额不足，请到开放平台充值',
      403: '没有访问权限',
      404: '接口不存在，请检查 Base URL',
      422: '请求内容不合法',
      429: '请求过于频繁，稍等片刻再试',
      500: '服务器开小差了，请重试',
      502: '网关错误，请重试',
      503: '服务繁忙，请稍后重试',
      504: '请求超时，请重试'
    };
    const head = map[status] || ('请求失败（' + status + '）');
    return msg ? head + '：' + msg : head;
  }

  async function checkKey() {
    const res = await fetch(base() + '/models', { headers: auth() });
    if (!res.ok) throw new ApiError(res.status, friendly(res.status, await res.text()));
    return true;
  }

  /**
   * streaming chat
   * handlers: onReasoning, onContent, onTool, onUsage
   */
  async function chatStream(opts) {
    const { messages, think, search, model, signal, handlers, extras } = opts;
    let useModel = model || S().model || 'deepseek-flash';
    if (search && useModel !== 'deepseek-flash') useModel = 'deepseek-flash';
    const body = {
      model: useModel,
      messages,
      stream: true,
      thinking: { type: think ? 'enabled' : 'disabled' }
    };
    if (think) body.reasoning_effort = 'high';
    if (search) body.tools = [{ type: 'deepseek_web_search' }, { type: 'deepseek_read_url' }];
    if (extras) { body.title = { enabled: true }; }

    let res;
    try {
      res = await fetch(base() + '/chat/completions', {
        method: 'POST', headers: auth(), body: JSON.stringify(body), signal
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw new ApiError(0, '网络连接失败，请检查网络后重试');
    }

    if (!res.ok) throw new ApiError(res.status, friendly(res.status, await res.text()));

    const reader = res.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    let finish = '';
    let usage = null, serverToolCalls = null, annotations = null, title = '';
    let stepMap = new Map();

    const handleTool = (ev) => {
      if (!ev || !ev.type) return;
      const step = ev.step != null ? ev.step : 0;
      if (!stepMap.has(step)) stepMap.set(step, { index: step, reasoning: '', calls: [] });
      const s = stepMap.get(step);
      if (ev.type === 'call_started') {
        s.calls.push(Object.assign({}, ev.call, { _live: true }));
        handlers.onTool && handlers.onTool({ phase: 'start', step, call: ev.call });
      } else if (ev.type === 'call_completed') {
        const list = s.calls;
        for (let i = list.length - 1; i >= 0; i--) {
          if (list[i].id && ev.call && list[i].id === ev.call.id) {
            list[i] = Object.assign(list[i], ev.call, { _live: false });
            break;
          }
        }
        handlers.onTool && handlers.onTool({ phase: 'done', step, call: ev.call });
      }
    };

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) > -1) {
          const line = buf.slice(0, nl).replace(/\r$/, '');
          buf = buf.slice(nl + 1);
          if (!line || line[0] === ':') continue;
          if (line.slice(0, 5) !== 'data:') continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') { buf = ''; break; }
          let j;
          try { j = JSON.parse(data); } catch (e) { continue; }
          if (j.error) throw new ApiError(200, j.error.message || '生成中断，请重试');
          if (j.usage) usage = j.usage;
          const ch = j.choices && j.choices[0];
          if (!ch) continue;
          if (ch.usage) usage = ch.usage;
          const d = ch.delta || {};
          if (d.reasoning_content) handlers.onReasoning && handlers.onReasoning(d.reasoning_content);
          if (d.content) handlers.onContent && handlers.onContent(d.content);
          if (ch.server_tool_event) handleTool(ch.server_tool_event);
          if (d.server_tool_calls) serverToolCalls = d.server_tool_calls;
          if (d.annotations) annotations = d.annotations;
          if (d.title) title = d.title;
          if (ch.finish_reason) finish = ch.finish_reason;
          if (j.error) throw new ApiError(200, j.error.message || '生成中断，请重试');
        }
      }
    } finally {
      try { reader.releaseLock(); } catch (e) { }
    }

    const steps = Array.from(stepMap.values()).sort((a, b) => a.index - b.index);
    return { finish, usage, serverToolCalls, annotations, steps, title };
  }

  async function uploadFile(file) {
    const name = (file.name || '').toLowerCase();
    const ext = (name.split('.').pop() || '');
    let purpose = 'text_recognition';
    if (['txt', 'md', 'markdown', 'csv', 'json', 'log', 'xml', 'html', 'htm', 'yml', 'yaml', 'ini', 'js', 'ts', 'py', 'java', 'c', 'cpp', 'go', 'rs', 'sql', 'sh', 'xlsx', 'xls', 'epub', 'mobi'].indexOf(ext) > -1) {
      purpose = 'user_data';
    } else if (['pdf', 'ppt', 'pptx'].indexOf(ext) > -1) {
      purpose = 'rich_layout_recognition';
    }
    const form = new FormData();
    form.append('purpose', purpose);
    form.append('file', file, file.name || 'file');
    const res = await fetch(base() + '/files', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + (S().apiKey || '').trim() },
      body: form
    });
    if (!res.ok) throw new ApiError(res.status, friendly(res.status, await res.text()));
    const j = await res.json();
    return { id: j.id, name: file.name, purpose };
  }

  async function asr(blob) {
    const form = new FormData();
    form.append('file', blob, 'speech.wav');
    const res = await fetch(base() + '/v1/tools/asr', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + (S().apiKey || '').trim() },
      body: form
    });
    if (!res.ok) throw new ApiError(res.status, friendly(res.status, await res.text()));
    const j = await res.json();
    return (j.text || '').trim();
  }

  async function tts(text, voice) {
    const res = await fetch(base() + '/v1/tools/tts', {
      method: 'POST',
      headers: auth(),
      body: JSON.stringify({ text, voice_id: voice || S().voice || 'stella', format: 'wav', filter_markdown: true })
    });
    if (!res.ok) throw new ApiError(res.status, friendly(res.status, await res.text()));
    return await res.blob();
  }

  return { checkKey, chatStream, uploadFile, asr, tts, base };
})();

/* ---------- pricing ---------- */
const PRICES = {
  'deepseek-flash': { hit: [0.02, 0.04], miss: [1, 2], out: [4, 8] },
  'deepseek-v4-pro': { hit: [0.15, 0.30], miss: [4.5, 9], out: [13.5, 27] }
};

function isPeakHour(d) {
  const t = new Date((d ? d.getTime() : Date.now()) + 8 * 3600 * 1000);
  const wd = t.getUTCDay();
  const hm = t.getUTCHours() + t.getUTCMinutes() / 60;
  if (wd === 0 || wd === 6) return false;
  return (hm >= 9 && hm < 12) || (hm >= 14 && hm < 18);
}

function normalizeUsage(u) {
  if (!u) return null;
  const hit = u.prompt_cache_hit_tokens != null ? u.prompt_cache_hit_tokens : (u.cache_read_input_tokens || 0);
  const inp = u.prompt_tokens != null ? u.prompt_tokens : (u.input_tokens || 0);
  const miss = u.prompt_cache_miss_tokens != null ? u.prompt_cache_miss_tokens : Math.max(0, inp - hit);
  const out = u.completion_tokens != null ? u.completion_tokens : (u.output_tokens || 0);
  const thinkTok = (u.completion_tokens_details && u.completion_tokens_details.reasoning_tokens) ||
    (u.output_tokens_details && u.output_tokens_details.thinking_tokens) || 0;
  const tool = u.server_tool_use || null;
  return { hit, miss, input: inp, out, thinkTok, tool, total: inp + out };
}

function costOf(usage, model) {
  const u = normalizeUsage(usage);
  if (!u) return null;
  const p = PRICES[model] || PRICES['deepseek-flash'];
  const peak = isPeakHour();
  const k = peak ? 1 : 0;
  const cHit = u.hit / 1e6 * p.hit[k];
  const cMiss = u.miss / 1e6 * p.miss[k];
  const cOut = u.out / 1e6 * p.out[k];
  return {
    usage: u, peak, model: model || S().model,
    price: { hit: p.hit[k], miss: p.miss[k], out: p.out[k] },
    cHit, cMiss, cOut, total: cHit + cMiss + cOut
  };
}


/* ==== js/30-chat.js ==== */
/* ================= chat view ================= */
const Chat = (() => {
  let streaming = false;
  let abortCtl = null;
  let dirty = false;
  let rafId = 0;
  let curEl = null;
  let startAt = 0;
  let firstTokenAt = 0;

  const draft = () => (S().draft = S().draft || { think: true, search: false });

  /* ---------- api payload ---------- */
  function reminderText() {
    const d = new Date();
    const wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
    const p2 = n => String(n).padStart(2, '0');
    const date = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
    const loc = /Asia\/(Shanghai|Chongqing|Urumqi|Harbin)/.test(tz) ? '中国' : '未知';
    return date + ',' + wd + ',' + loc + ',App,中文';
  }

  function buildMessages(conv, withReminder) {
    const out = [];
    conv.messages.forEach(m => {
      if (m.role === 'user') {
        const blocks = [];
        (m.attachments || []).forEach(a => {
          if (a.kind === 'image' && a.dataUrl) blocks.push({ type: 'image_url', image_url: { url: a.dataUrl } });
          else if (a.kind === 'file' && a.fileId) blocks.push({ type: 'file', file_id: a.fileId });
        });
        if (blocks.length) {
          if (m.content) blocks.push({ type: 'text', text: m.content });
          out.push({ role: 'user', content: blocks });
        } else if (m.content) {
          out.push({ role: 'user', content: m.content });
        }
      } else if (m.role === 'assistant' && m.content && !m.error) {
        const o = { role: 'assistant', content: m.content };
        if (m.reasoning) o.reasoning_content = m.reasoning;
        if (m.serverToolCalls) o.server_tool_calls = m.serverToolCalls;
        out.push(o);
      }
    });
    if (withReminder) {
      let li = -1;
      for (let i = out.length - 1; i >= 0; i--) { if (out[i].role === 'user') { li = i; break; } }
      if (li > -1) out.splice(li, 0, { role: 'latest_reminder', content: reminderText() });
    }
    return out;
  }

  /* ---------- rendering ---------- */
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function renderAll() {
    const conv = curConv();
    const box = $('#messages');
    box.innerHTML = '';
    $('#empty').hidden = !!(conv && conv.messages.length);
    if (!conv) return;
    conv.messages.forEach(m => box.appendChild(renderMsg(m)));
    if (streaming) {
      const target = conv.messages.find(m => m.streaming);
      curEl = target ? box.querySelector('[data-id="' + target.id + '"]') : null;
      if (curEl) curEl.__m = target;
    }
    scrollBottom(true);
    updateTitle();
    if (window.__syncBottomBtn) window.__syncBottomBtn();
  }

  function updateTitle() {
    const c = curConv();
    const t = c && c.title ? c.title : '';
    const el2 = $('#convTitle');
    el2.textContent = t;
    const sc = $('#scroll');
    el2.classList.toggle('show', !!t && (sc.scrollTop > 26 || (c && c.messages.length > 0)));
  }

  function renderMsg(m) {
    if (m.role === 'user') return renderUser(m);
    return renderAI(m);
  }

  function renderUser(m) {
    const wrap = el('div', 'msg user');
    wrap.dataset.id = m.id;
    const b = el('div', 'bubble');
    const inner = el('div', 'bubble-body');
    if ((m.attachments || []).length) {
      const at = el('div', 'bubble-attach');
      m.attachments.forEach(a => {
        if (a.kind === 'image' && a.dataUrl) {
          const img = el('img', 'attach-thumb'); img.src = a.dataUrl; at.appendChild(img);
        } else {

          at.appendChild(f);
        }
      });
      inner.appendChild(at);

    if (m.content) {
      const t = el('div', 'utext');
      t.textContent = m.content;
      inner.appendChild(t);
    }
    b.appendChild(inner);
    wrap.appendChild(b);
    return wrap;
  }

  function renderAI(m) {
    const wrap = el('div', 'msg ai');
    wrap.dataset.id = m.id;

    // thinking block
    if (m.showThink) {
      const think = el('div', 'think' + (m.thinkOpen ? ' open' : ''));

      } else {

        label = `已思考（用时 ${sec} 秒）`;

      head.innerHTML = `<span>${label}</span><svg class="chev"><use href="#i-chev-r"/></svg>`;
      think.appendChild(head);
      const body = el('div', 'think-body');
      body.innerHTML = renderThinkSeq(m);
      think.appendChild(body);
      wrap.appendChild(think);
    }

    const ans = el('div', 'answer');
    if (m.content) {
      const cit = MD.withCitations(m.content, m.annotations);
      ans.innerHTML = MD.render(cit.text, cit.cites);
      if (m.streaming) {
        const caret = el('span', 'caret'); ans.appendChild(caret);
      }
    } else if (m.streaming) {
      ans.innerHTML = '<span class="caret"></span>';

    wrap.appendChild(ans);

    if (srcs.length) {

      pill.type = 'button';
      pill.dataset.act = 'sources';
      const favs = srcs.slice(0, 3).map(s => s.icon ? `<img class="fav" src="${esc(s.icon)}" onerror="this.outerHTML='<span class=&quot;fav fav-ph&quot;><svg><use href=&quot;#i-globe&quot;/></svg></span>'">` : `<span class="fav fav-ph"><svg><use href="#i-globe"/></svg></span>`).join('');
      pill.innerHTML = `<span class="favs">${favs}</span><span>${srcs.length} 个网页</span>`;
      wrap.appendChild(pill);
    }

    if (!m.streaming && m.content && srcs.length) {
      wrap.appendChild(el('div', 'answer-note', '本回答由 AI 生成，内容仅供参考，请仔细甄别'));
    }

    if (m.error) {
      const eb = el('div', 'err-box');
      const needsKey = m.errStatus === 401 || m.errStatus === 402 || m.errStatus === 403;
      eb.innerHTML = `<div>${esc(m.error)}</div><div class="err-acts"><button type="button" data-act="retry">重试</button>${needsKey ? '<button type="button" data-act="apiset">去设置 API</button>' : ''}</div>`;
      wrap.appendChild(eb);
    }

    if (!m.streaming && m.stopped && m.content) {
      const sn = el('div', 'answer-note stopped');
      sn.textContent = '已停止生成';
      wrap.appendChild(sn);
    }
    if (!m.streaming && m.content) {
      wrap.appendChild(renderActions(m));
    }
    return wrap;
  }

  function renderActions(m) {
    const a = el('div', 'actions');
    a.innerHTML =
      `<button type="button" data-act="copy" aria-label="复制" title="复制">${icon('i-copy')}</button>` +
      `<button type="button" data-act="like" aria-label="赞" title="赞">${icon('i-up')}</button>` +
      `<button type="button" data-act="dislike" aria-label="踩" title="踩">${icon('i-down')}</button>` +
      `<button type="button" data-act="read" aria-label="朗读" title="朗读">${icon('i-speaker')}</button>` +
      `<button type="button" data-act="share" aria-label="分享" title="分享">${icon('i-share')}</button>` +
      `<span class="spacer"></span>` +
      (S().billing && m.usage ? `<button type="button" class="bill" data-act="bill" aria-label="本轮消耗额度" title="本轮消耗额度">¥ ${fmtCost(costOf(m.usage, m.model).total)}</button>` : '') +
      `<button type="button" data-act="regen" title="重新生成">${icon('i-refresh')}</button>`;
    return a;
  }

  function isPageCall(c) {
    return !!(c && c.action && c.action.type === 'open_page');
  }

  function renderThinkSeq(m) {
    const seq = m.thinkSeq || [];
    if (!seq.length && !m.reasoning) return `<div class="think-p"><span class="dot">\u2022</span><span class="tx">${esc('正在思考\u2026')}</span></div>`;
    let html = '';
    let i = 0;
    while (i < seq.length) {
      const item = seq[i];
      if (item.type === 'reason') {
        const paras = String(item.text || '').split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
        paras.forEach(p => {
          html += `<div class="think-p"><span class="dot">\u2022</span><span class="tx">${esc(p)}</span></div>`;
        });
        i++;
      } else if (item.type === 'call') {
        if (isPageCall(item.call)) {
          let n = 0; const list = [];
          while (i < seq.length && seq[i].type === 'call' && isPageCall(seq[i].call)) {
            const c = seq[i].call;
            n++;
            if (c.page && (c.page.title || c.page.url)) list.push({ url: c.page.url, title: c.page.title, icon: '' });
            (c.sources || []).forEach(x => list.push({ url: x.url, title: x.title, icon: x.site_icon || '' }));
            i++;
          }
          const src = uniqSources(list).slice(0, 4);
          const favs = src.map(x => x.icon ? `<img class="fav" src="${esc(x.icon)}" onerror="this.remove()">` : '').join('');
          html += `<div class="tool-row"><svg class="ti"><use href="#i-doc"/></svg><span>${n > 1 ? '已浏览 ' + n + ' 个页面' : '已浏览页面'}</span><span class="favs">${favs}</span></div>`;
        } else {
          html += renderToolRow(item.call);
          i++;
        }
      } else i++;
    }
    return html || `<div class="think-p"><span class="dot">\u2022</span><span class="tx">${esc('正在思考\u2026')}</span></div>`;
  }

  function renderToolRow(call) {
    if (!call) return '';
    const k = call.kind || '';
    const act = (call.action && call.action.type) || '';
    let label = '', ico = 'i-magnify';
    if (k === 'search' || act === 'search') {
      const n = uniqSources(call.sources || []).length;
      label = `搜索到 ${n || ''} 个网页`;
    } else if (k === 'image_search' || k === 'deep_image_search') {
      const n = uniqSources(call.sources || []).length;
      label = `搜索到 ${n || ''} 张图片`;
    } else if (act === 'open_page' || k === 'deep_search') {
      label = `已浏览页面`; ico = 'i-doc';
    } else if (act === 'find_in_page') {
      label = `页面内查找`; ico = 'i-search';
    } else if (k === 'read_link') {
      label = `阅读链接`; ico = 'i-doc';
    } else {
      label = '正在检索'; ico = 'i-magnify';
    }
    if (call._live) label = '正在' + label.replace(/^搜索到.*/, '搜索') + '…';
    const src = uniqSources(call.sources || []).slice(0, 4);
    const favs = src.map(s => s.icon ? `<img class="fav" src="${esc(s.icon)}" onerror="this.remove()">` : '').join('');
    return `<div class="tool-row"><svg class="ti"><use href="#${ico}"/></svg><span>${esc(label)}</span><span class="favs">${favs}</span></div>`;
  }

  function uniqSources(list) {
    const seen = new Set(); const out = [];
    (list || []).forEach(s => {
      if (!s || !s.url) return;
      if (seen.has(s.url)) return;
      seen.add(s.url);
      out.push({ url: s.url, title: s.title, icon: s.site_icon || '', snippet: s.snippet || '' });
    });
    return out;
  }

  function collectSources(m) {
    const all = [];
    (m.steps || []).forEach(st => (st.calls || []).forEach(c => all.push.apply(all, uniqSources(c.sources || []))));
    return uniqSources(all);
  }

  /* ---------- streaming re-render ---------- */
  let renderTimer = 0;
  let lastRenderAt = 0;

  function scheduleRender() {
    dirty = true;
    if (renderTimer) return;
    const wait = Math.max(0, 90 - (Date.now() - lastRenderAt));
    renderTimer = setTimeout(() => {
      renderTimer = 0;
      if (!dirty) return;
      dirty = false;
      if (!streaming || !curEl) return;
      const m = curEl.__m;
      if (!m) return;
      lastRenderAt = Date.now();
      const nearBottom = isNearBottom();
      const fresh = renderAI(m);
      curEl.replaceWith(fresh);
      curEl = fresh; curEl.__m = m;
      if (nearBottom) scrollBottom(true);
    }, wait);
  }

  function isNearBottom() {
    const sc = $('#scroll');
    return sc.scrollHeight - sc.scrollTop - sc.clientHeight < 160;
  }
  function scrollBottom(force) {
    const sc = $('#scroll');
    if (!sc) return;
    if (force || isNearBottom()) sc.scrollTop = sc.scrollHeight;
  }

  /* ---------- send ---------- */
  async function send(text, opts) {
    opts = opts || {};
    if (streaming) { toast('正在生成，先停止再发送'); return; }
    if (!S().apiKey) { openSetup(); return; }
    const conv = ensureConv();
    const d = draft();
    const think = opts.think != null ? opts.think : !!d.think;
    const search = opts.search != null ? opts.search : !!d.search;

    let content = (text || '').trim();
    const atts = (opts.attachments || draftAtts()).slice();
    if (!content && !atts.length) return;

    // 与原版一致：深度思考用一次后自动关闭，智能搜索保持
    if (think) { d.think = false; Store.save(); }

    if (!opts.silent) {
      const um = { id: uid(), role: 'user', content, attachments: atts, createdAt: Date.now() };
      conv.messages.push(um);
      if (!conv.title) conv.title = (content || (atts[0] && atts[0].name) || '新对话').slice(0, 20);
      clearDraftAtts();
      renderAll();
    }

    const am = {
      id: uid(), role: 'assistant', content: '', reasoning: '',
      thinkSeq: [], steps: [], streaming: true, streamingThink: think,
      showThink: think, thinkOpen: false, model: S().model, createdAt: Date.now()
    };
    conv.messages.push(am);
    touched(conv);
    renderAll();
    curEl = $('#messages').lastElementChild;
    curEl.__m = am;

    streaming = true;
    startAt = Date.now();
    firstTokenAt = 0;
    abortCtl = new AbortController();
    updateSendBtn();

    let attempt = 0;
    let useExtras = true;

    const run = async () => {
      while (true) {
        try {
          const messages = buildMessages(conv, useExtras);
          const r = await API.chatStream({
            messages, think, search, model: am.model, signal: abortCtl.signal, extras: useExtras,
            handlers: {
              onReasoning: (t) => {
                if (!firstTokenAt) firstTokenAt = Date.now();
                am.reasoning += t;
                const last = am.thinkSeq[am.thinkSeq.length - 1];
                if (last && last.type === 'reason') last.text += t;
                else am.thinkSeq.push({ type: 'reason', text: t });
                scheduleRender();
              },
              onContent: (t) => {
                if (!firstTokenAt) firstTokenAt = Date.now();
                am.content += t;
                am.streamingThink = false;
                scheduleRender();
              },
              onTool: (ev) => {
                if (ev.phase === 'start') {
                  am.thinkSeq.push({ type: 'call', call: ev.call });
                } else {
                  for (let i = am.thinkSeq.length - 1; i >= 0; i--) {
                    const it = am.thinkSeq[i];
                    if (it.type === 'call') {
                      it.call = Object.assign({}, it.call, ev.call, { _live: false });
                      break;
                    }
                  }
                  const st = am.steps.find(s => s.index === ev.step) || { index: ev.step, calls: [] };
                  st.calls.push(ev.call);
                  if (!am.steps.includes(st)) am.steps.push(st);
                }
                scheduleRender();
              }
            }
          });
          if (r.title && conv.messages.length <= 2) { conv.title = String(r.title).slice(0, 40); }
          am.annotations = r.annotations || null;
          am.serverToolCalls = r.serverToolCalls || null;
          am.usage = r.usage || null;
          am.finish = r.finish;
          if (r.steps && r.steps.length) am.steps = r.steps;
          break;
        } catch (e) {
          if (e && e.name === 'AbortError') { am.stopped = true; break; }
          const status = e && e.status;
          if (status === 400 && useExtras && attempt < 2) {
            useExtras = false; attempt++;
            continue;
          }
          if ((status === 429 || status === 503 || status === 502 || status === 504) && attempt < 2) {
            attempt++;
            am.error = null;
            toast((status === 429 ? '请求太频繁' : '服务繁忙') + '，正在重试（' + attempt + '/2）…');
            await sleep(1500 * attempt);
            continue;
          }
          am.error = (e && e.status) ? (e.message || '请求失败') : '网络连接失败，请检查网络后重试';
          am.errStatus = status || 0;
          break;
        }
      }
    };

    try {
      await run();
    } finally {
      streaming = false;
      am.streaming = false;
      am.streamingThink = false;
    }

    am.thinkMs = (firstTokenAt || Date.now()) - startAt;
    if (!am.reasoning && !am.thinkSeq.length) am.showThink = false;
    else am.showThink = true;
    if (!am.content && !am.reasoning && !am.error && !am.stopped) am.error = '没有收到回复，请重试';
    if (!am.content && am.error) am.lean = true;
    touched(conv);
    Store.save();
    curEl = null;
    renderAll();
    updateSendBtn();
    if (S().autoRead && am.content && curConv() === conv) readAloud(am);
    if (am.error) scrollBottom(true);
  }

  function stop() {
    if (abortCtl) { try { abortCtl.abort(); } catch (e) { } }
    streaming = false;
    updateSendBtn();
  }

  /* ---------- regenerate ---------- */
  function regenerate(msgId) {
    const conv = curConv();
    if (!conv) return;
    const i = conv.messages.findIndex(m => m.id === msgId);
    if (i < 0) return;
    // remove this assistant message
    conv.messages.splice(i, 1);
    // find previous user message
    let ui = -1;
    for (let k = conv.messages.length - 1; k >= 0; k--) { if (conv.messages[k].role === 'user') { ui = k; break; } }
    if (ui < 0) { renderAll(); return; }
    const userMsg = conv.messages[ui];
    // remove trailing assistant after that user
    conv.messages.splice(ui + 1);
    const atts = userMsg.attachments || [];
    const text = userMsg.content;
    conv.messages.splice(ui, 1);
    touched(conv);
    send(text, { attachments: atts, silent: false });
  }

  /* ---------- read aloud ---------- */
  let audioEl = null;
  async function readAloud(m) {
    const text = MD.plain(m.content || '');
    if (!text) return;
    try {
      toast('正在合成语音…');
      const blob = await API.tts(text.slice(0, 9000));
      if (audioEl) { try { audioEl.pause(); } catch (e) { } audioEl = null; }
      const url = URL.createObjectURL(blob);
      audioEl = new Audio(url);
      audioEl.play().catch(() => toast('点一下页面再试'));
      audioEl.onended = () => { try { URL.revokeObjectURL(url); } catch (e) { } audioEl = null; };
    } catch (e) {
      toast(e.message || '语音合成失败');
    }
  }

  /* ---------- draft attachments ---------- */
  function draftAtts() {
    U().atts = U().atts || [];
    return U().atts;
  }
  function clearDraftAtts() { U().atts = []; renderAtts(); }
  function renderAtts() {
    const box = $('#attachPreview');
    const list = draftAtts();
    box.innerHTML = '';
    if (!list.length) { box.hidden = true; return; }
    box.hidden = false;
    list.forEach((a, i) => {
      const c = el('div', 'attach-chip' + (a.kind === 'image' ? ' img' : ''));
      if (a.kind === 'image' && a.dataUrl) {
        c.innerHTML = `<img src="${a.dataUrl}" alt=""><button class="rm" type="button" data-i="${i}">✕</button>`;
      } else {
        c.innerHTML = `<span class="nm">${esc(a.name || '文件')}</span>${a.uploading ? '<span style="font-size:11px;color:var(--text-3)">上传中</span>' : `<button class="rm" type="button" data-i="${i}">✕</button>`}`;
      }
      box.appendChild(c);
    });
  }

  function toggleThink(msgId) {
    const m = findMsgById(msgId);
    if (!m) return;
    m.thinkOpen = !m.thinkOpen;
    renderAll();
  }

  function findMsgById(id) {
    const c = curConv();
    if (!c) return null;
    return c.messages.find(x => x.id === id) || null;
  }

  return {
    renderAll, send, stop, regenerate, readAloud, toggleThink, findMsgById,
    renderAtts, draftAtts, clearDraftAtts,
    isStreaming: () => streaming,
    updateSendBtn
  };

  function updateSendBtn() {
    const hasText = ($('#input').value || '').trim().length > 0;
    const hasAtt = draftAtts().length > 0;
    const uploading = draftAtts().some(a => a.uploading);
    const btn = $('#btnSend');
    btn.hidden = !(hasText || hasAtt || streaming);
    $('#btnMic').hidden = !!(hasText || hasAtt) || streaming;
    if (streaming) {
      btn.classList.add('stop');
      btn.innerHTML = '<svg><use href="#i-stop"/></svg>';
      btn.disabled = false;
    } else {
      btn.classList.remove('stop');
      btn.innerHTML = '<svg><use href="#i-arrow-up"/></svg>';
      btn.disabled = false;
    }
    if (!streaming && uploading) { btn.disabled = true; btn.title = '文件上传中'; }
    else { btn.disabled = false; btn.title = ''; }
    $('#chipThink').classList.toggle('on', !!draft().think);
    $('#chipSearch').classList.toggle('on', !!draft().search);
    const ar = S().autoRead;
    $('#autoReadIcon').setAttribute('href', ar ? '#i-speaker' : '#i-speaker-off');
  }
})();


/* ==== js/40-nav.js ==== */
/* ================= navigation / sheets ================= */
const Nav = (() => {
  let stack = [];
  let onCloseCb = null;

  function root() { return $('#sheetRoot'); }
  function sheetEl() { return $('#sheet'); }

  function renderTop() {
    const cfg = stack[stack.length - 1];
    if (!cfg) return;
    const s = sheetEl();
    s.className = 'sheet' + (cfg.full ? ' full' : '') + (cfg.glass ? ' glass' : '') + (cfg.cls ? ' ' + cfg.cls : '');
    s.innerHTML = '';
    s.onclick = null;
    if (cfg.head !== false) {
      const head = h('div', 'sheet-head');
      if (stack.length > 1) {
        const b = h('button', 'back'); b.innerHTML = '<svg><use href="#i-back"/></svg>';
        b.onclick = () => back();
        head.appendChild(b);
      }
      const t = h('div', 'ttl', cfg.title || '');
      head.appendChild(t);
      if (cfg.headClose !== false) {
        const c = h('button', 'close'); c.innerHTML = '<svg><use href="#i-close"/></svg>';
        c.onclick = () => closeAll();
        head.appendChild(c);
      }
      s.appendChild(head);
    }
    const body = h('div', 'sheet-body');
    if (typeof cfg.body === 'function') body.innerHTML = cfg.body();
    else if (typeof cfg.body === 'string') body.innerHTML = cfg.body;
    else if (cfg.body) body.appendChild(cfg.body);
    s.appendChild(body);
    if (cfg.footer) s.appendChild(cfg.footer);
    if (cfg.after) cfg.after(body);
  }

  let hideTimer = 0;

  function open(cfg) {
    clearTimeout(hideTimer);
    stack.push(cfg);
    const r = root();
    r.hidden = false;
    r.style.pointerEvents = '';
    r.classList.toggle('blurred', cfg.cls === 'plus-sheet');
    renderTop();
    const s = sheetEl();
    s.classList.remove('in');
    void s.offsetWidth;
    s.classList.add('in');
    r.classList.add('visible');
    $('#sheetBackdrop').onclick = () => closeAll();
  }

  function back() {
    if (stack.length <= 1) return closeAll();
    stack.pop();
    renderTop();
  }

  /* 收起：立刻变成不可见且不拦截点击，DOM 清理由定时器兜底。
     即使定时器被后续 open 清掉，也不会留下模糊遮罩。 */
  function hideNow() {
    clearTimeout(hideTimer);
    const r = root();
    const s = sheetEl();
    s.classList.remove('in');
    r.classList.remove('visible', 'blurred');
    r.style.pointerEvents = 'none';
    stack = [];
    hideTimer = setTimeout(() => {
      if (stack.length) return;
      r.hidden = true;
      s.innerHTML = '';
      r.style.pointerEvents = '';
    }, 260);
  }

  function closeAll() { hideNow(); }

  /* 关闭当前弹层并立即换一个（用于改完设置后回到列表，避免重复入栈） */
  function reopen(fn) {
    hideNow();
    setTimeout(fn, 30);
  }

  /* ---------- common row ---------- */
  function row(ico, label, value, act, opts) {
    opts = opts || {};
    return `<div class="row${opts.danger ? ' danger' : ''}" ${act ? `data-act="${act}"` : ''}>
      <span class="ri"><svg><use href="#${ico}"/></svg></span>
      <span class="rl">${esc(label)}</span>
      ${value != null ? `<span class="rv">${esc(value)}</span>` : ''}
      ${opts.noChev ? '' : '<svg class="rc"><use href="#i-chev-r"/></svg>'}
    </div>`;
  }
  function switchRow(ico, label, on, act) {
    return `<div class="row" data-act="${act}">
      ${ico ? `<span class="ri"><svg><use href="#${ico}"/></svg></span>` : ''}
      <span class="rl">${esc(label)}</span>
      <span class="switch${on ? ' on' : ''}"></span>
    </div>`;
  }

  /* ---------- settings ---------- */
  function settings() {
    const s = S();
    const themeName = s.theme === 'system' ? '跟随系统' : (s.theme === 'dark' ? '深色' : '浅色');
    const body = `
      <div class="group-label">账户</div>
      <div class="card">
        ${row('i-user', '账号管理', '', 'account')}
        ${row('i-db', '数据管理', '', 'data')}
        ${row('i-key', 'API 设置', s.apiKey ? '已接入' : '未接入', 'api')}
      </div>
      <div class="group-label">应用</div>
      <div class="card">
        ${row('i-lang', '语言', '简体中文', 'lang')}
        ${row('i-sun', '外观', themeName, 'theme')}
        ${row('i-aa', '字体大小', { small: '小', normal: '标准', large: '大', xlarge: '特大' }[s.font] || '标准', 'font')}
        ${row('i-spark', '个性化', '', 'personal')}
      </div>
      <div class="group-label">语音</div>
      <div class="card">
        ${row('i-speaker', '朗读音色', s.voice === 'tide' ? '暗潮' : '海星', 'voice')}
        ${switchRow('i-speaker', '自动朗读回答', !!s.autoRead, 'toggle-autoread')}
      </div>
      <div class="group-label">关于</div>
      <div class="card">
        ${row('i-info', '检查更新', '2.5.1(1)', 'check-update')}
        ${row('i-doc', '服务协议', '', 'terms')}
      </div>
      <div class="card" style="margin-top:12px">
        ${row('i-help', '帮助与反馈', '', 'help')}
      </div>
      <div class="row about-min" style="background:none">DeepSeek 本机 API 客户端 · 数据仅存于本机</div>
    `;
    open({ title: '设置', body, full: true, after: bindSettings });
  }

  function bindSettings(box) {
    box.addEventListener('click', (e) => {
      const r = e.target.closest('[data-act]');
      if (!r) return;
      const act = r.dataset.act;
      if (act === 'account') { account(); }
      else if (act === 'data') { dataSheet(); }
      else if (act === 'api') { apiSheet(); }
      else if (act === 'lang') { toast('当前仅支持简体中文'); }
      else if (act === 'theme') { themeSheet(); }
      else if (act === 'font') { fontSheet(); }
      else if (act === 'personal') { personalSheet(); }
      else if (act === 'voice') { voiceSheet(); }
      else if (act === 'toggle-autoread') { S().autoRead = !S().autoRead; Store.save(); Chat.updateSendBtn(); renderTop(); }
      else if (act === 'check-update') { toast('已是最新版本 2.5.1(1)'); }
      else if (act === 'terms') { termsSheet(); }
      else if (act === 'help') { helpSheet(); }
    });
  }

  function themeSheet() {
    const cur = S().theme;
    const opt = (k, t) => `<div class="row" data-t="${k}"><span class="rl">${t}</span>${cur === k ? '<span class="ri" style="color:var(--blue)"><svg><use href="#i-check"/></svg></span>' : ''}</div>`;
    open({
